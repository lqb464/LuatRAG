name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m ruff check backend src scripts tests
      - run: python -m ruff format --check backend src scripts tests
      - run: python -m pytest -q

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -r backend/requirements.txt
      - run: docker compose config --quiet
      - run: docker build -t luatrag-backend -f backend/Dockerfile .
      - run: docker build -t luatrag-frontend -f frontend/Dockerfile .
      - name: Start real Docker services
        run: docker compose up -d --no-build --wait --wait-timeout 90
      - name: Docker storage and API smoke test
        run: python -m scripts.smoke_storage --base-url http://localhost:3018
      - name: Docker logs
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop Docker services
        if: always()
        run: docker compose down

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -r backend/requirements.txt
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - name: Storage and API smoke test
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          backend_log="$RUNNER_TEMP/luatrag-backend.log"
          frontend_log="$RUNNER_TEMP/luatrag-frontend.log"
          LUATRAG_DATA_DIR="$RUNNER_TEMP/luatrag-data" python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 >"$backend_log" 2>&1 &
          backend_pid=$!
          npm --prefix frontend run start >"$frontend_log" 2>&1 &
          frontend_pid=$!
          cleanup() {
            kill "$backend_pid" "$frontend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null && curl --fail --silent http://localhost:3000/api/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$backend_log" "$frontend_log"
            exit 1
          fi
          if ! python -m scripts.smoke_storage --base-url http://localhost:3000; then
            cat "$backend_log" "$frontend_log"
            exit 1
          fi
