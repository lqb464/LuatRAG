[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-rag"
version = "2.0.0"
description = "Python-first document RAG demo with replaceable LLM providers"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40,<2",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "frontend"]
