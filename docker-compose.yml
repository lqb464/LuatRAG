name: luatrag

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8018}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3018}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      LUATRAG_BFF_SECRET: ${LUATRAG_BFF_SECRET:-}
      LUATRAG_DATA_DIR: /data
    volumes:
      - luatrag_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health',headers={'x-luatrag-bff-secret':os.getenv('LUATRAG_BFF_SECRET',''),'oai-authenticated-user-id':'healthcheck'}); urllib.request.urlopen(r,timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3018}:3000"
    environment:
      API_ORIGIN: http://backend:8000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3018}
      APP_ENV: ${APP_ENV:-development}
      LUATRAG_BFF_SECRET: ${LUATRAG_BFF_SECRET:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  luatrag_data:
