[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "luatrag"
version = "1.0.0"
description = "Python-first Vietnamese legal RAG with verifiable citations"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "pydantic==2.13.5",
  "uvicorn[standard]==0.53.0",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "python-dotenv==1.2.3",
  "pypdf==6.19.0",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[tool.setuptools.packages.find]
include = ["backend*", "src*"]

[tool.setuptools.package-data]
backend = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".venv/.pytest_cache"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend", ".venv"]
cache-dir = ".venv/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
